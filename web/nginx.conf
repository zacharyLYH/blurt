# Blurt web tier: static PWA plus a proxy to the Go server. The container is
# the only published port; the server stays private on blurt-net.
upstream blurt_server {
  server server:8080;
}

# Browsers reject a manifest served as octet-stream.
types {
  application/manifest+json webmanifest;
}

# Public TLS usually ends before nginx (tunnel or reverse proxy), which
# forwards X-Forwarded-Proto. Trust it only because nginx is bound to
# 127.0.0.1; otherwise fall back to the local scheme. Go uses this to set
# the Secure session cookie.
map $http_x_forwarded_proto $blurt_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  # The unprivileged nginx image runs as a non-root user, so it binds 8080.
  listen 8080;
  root /usr/share/nginx/html;

  # Keep every response hardened. Locations below use `expires`, not
  # add_header, because a child add_header would drop these server-level ones.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
  # Ignored over plain http, so local dev is unaffected.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Audio uploads (Opus blobs) land here later.
  client_max_body_size 25m;

  location = /health {
    proxy_pass http://blurt_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $blurt_proto;
  }

  location /api/ {
    proxy_pass http://blurt_server;
    # $http_host keeps the port: the server builds notification targets from
    # the request Host, and a portless host is not the origin the app runs on.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $blurt_proto;
    # Agent turns can outlive nginx's 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The worker must revalidate on every load so handler changes ship. It is
  # served from the root, so its scope is already the whole origin.
  location = /sw.js {
    expires -1;
  }

  location = /manifest.webmanifest {
    expires -1;
  }

  # Build output is fingerprinted, so it can be cached hard.
  location /assets/ {
    expires 1y;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # SPA shell: unknown paths render the app, and index.html stays uncached
  # so a deploy takes effect immediately.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
